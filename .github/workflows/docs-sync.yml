name: Docs Sync

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  docs-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run docs sync guard
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            python3 scripts/check_docs_sync.py --base "$PR_BASE_SHA" --head "$HEAD_SHA"
          else
            python3 scripts/check_docs_sync.py --base "$PUSH_BEFORE_SHA" --head "$HEAD_SHA"
          fi
